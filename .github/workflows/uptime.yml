name: Проверка доступности сайта

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить сайт и сертификат
        run: |
          set +e
          CODE=$(curl -s -o /tmp/page -L --max-time 25 -w "%{http_code}" https://dreamost.ru/)
          TITLE=$(grep -o '<title>[^<]*' /tmp/page | head -1)
          DAYS=$(( ( $(date -d "$(echo | openssl s_client -connect dreamost.ru:443 -servername dreamost.ru 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)" +%s) - $(date +%s) ) / 86400 ))
          echo "code=$CODE title=$TITLE cert_days=$DAYS"
          PROBLEM=""
          [ "$CODE" != "200" ] && PROBLEM="Сайт не отвечает, код $CODE"
          [ -z "$TITLE" ] && [ "$CODE" = "200" ] && PROBLEM="Страница открылась пустой"
          [ "$DAYS" -lt 10 ] 2>/dev/null && PROBLEM="$PROBLEM. Сертификат истекает через $DAYS дн."
          if [ -n "$PROBLEM" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TG_CHAT }}" -d parse_mode=HTML \
              --data-urlencode "text=🔴 <b>Внешняя проверка: проблема</b>%0A%0A$PROBLEM%0A%0AПроверка с серверов GitHub, то есть сайт недоступен снаружи." >/dev/null
            exit 1
          fi
